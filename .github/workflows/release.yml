name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Release tags must point to a commit on main."; exit 1; }
        shell: bash
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          [[ "$GITHUB_REF_NAME" == v0.* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $pre
        shell: bash
